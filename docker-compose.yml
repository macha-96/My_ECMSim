version: "3.8"

services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_container
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API端口
      - "9001:9001"   # Web控制台端口
    volumes:
      - ./data/rustfs/data:/data
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_SERVER_DOMAINS=example.com
    command:
      - --address
      - :9000
      - --console-enable
      - --server-domains
      - example.com
      - --access-key
      - rustfsadmin
      - --secret-key
      - rustfsadmin
      - /data

  mysql_server:
    image: mysql:latest
    container_name: mysql_server
    environment:
      - MYSQL_ROOT_PASSWORD=root_password   # 设置 root 用户密码
      - MYSQL_DATABASE=aod_system           # 初始化数据库名称
      - MYSQL_USER=my_user                  # 创建的用户名称
      - MYSQL_PASSWORD=my_password          # 用户密码
    ports:
      - "3306:3306"                         # 映射主机和容器的 MySQL 端口
    volumes:
      - ./data/mysql_data:/var/lib/mysql         # 数据持久化存储
      - ./data/mysql_conf:/etc/mysql/conf.d      # 自定义配置文件挂载
    restart: always # 容器自动重启策略
