# DQN global hyperparameters
device: "cpu"
gamma: 0.95
lr: 0.005
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay: 20000
target_update_step: 100
buffer_capacity: 10000
batch_size: 64
max_train_episode: 3000

# gRPC / HTTP backend addresses
grpc_target: "localhost:50051"
http_target: "http://localhost:8080"

# Weight save path
weight_save_dir: "./weights"

# Scene entities for training setup
scene_radars:
  - id: 1
    x: 0
    y: 0
    Pt_dBm: 20
    G_dB: 25
    freq: 10000000000.0
    bandwidth: 1000000.0
    sigma: 5
    thresh_db: -50

scene_jammers:
  - id: 1
    x: 5000
    y: 0
    Pj_dBm: 0
    Gj_dB: 10
    jam_freq: 10000000000.0
    jam_type: "NOISE_JAM"

# State / action dimensions
state_dim: 9
action_dim: 21
power_level_num: 7
freq_shift_num: 3

# ===== Multi-dimensional continuous reward (from optimize.md) =====
# Sigmoid: Pd = 1/(1+exp(-alpha*(SINR_dB - gamma)))
# gamma approximates the radar detection threshold
sigmoid_alpha: 0.5
sigmoid_gamma: -50.0

# Reward weights: R = wd*(1-Pd) + wf*avg_zeta - wp*(P_dBm/60)
reward_weights:
  wd: 1.0     # detection probability weight
  wf: 0.3     # frequency match weight  
  wp: 0.01    # power penalty weight
  default: 0.1