# DQN global hyperparameters
device: "cpu"
gamma: 0.95
lr: 0.005
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay: 20000
target_update_step: 100
buffer_capacity: 10000
batch_size: 64
max_train_episode: 3000

# gRPC / HTTP backend addresses
grpc_target: "localhost:50051"
http_target: "http://localhost:8080"

# Weight save path
weight_save_dir: "./weights"

# Scene entities for training setup
scene_radars:
  - id: 1
    x: 0
    y: 0
    Pt_dBm: 20
    G_dB: 25
    freq: 10000000000.0
    bandwidth: 1000000.0
    sigma: 5
    thresh_db: -50
  - id: 2
    x: 15000
    y: 0
    Pt_dBm: 30
    G_dB: 25
    freq: 12000000000.0
    bandwidth: 1000000.0
    sigma: 5
    thresh_db: -50

scene_jammers:
  - id: 1
    x: 5000
    y: 0
    Pj_dBm: 0
    Gj_dB: 10
    jam_freq: 10000000000.0
    jam_type: "NOISE_JAM"
  - id: 2
    x: 10000
    y: 5000
    Pj_dBm: 0
    Gj_dB: 10
    jam_freq: 12000000000.0
    jam_type: "NOISE_JAM"

# State / action dimensions
# state_dim = 9 (base threat-weighted) + 4 (coverage features)
# Coverage features: [uncovered_count_norm, nearest_uncovered_dist, nearest_uncovered_freq, nearest_uncovered_delta_f]
# Fixed size → works with unlimited radars
state_dim: 13
action_dim: 21         # 7 power × 3 freq_shift (fixed, radar-count agnostic)
power_level_num: 7
freq_shift_num: 3
freq_shift_mult: 2500  # Cover ±2.5 GHz radar separation

# ===== Multi-dimensional continuous reward =====
# Sigmoid: Pd = 1/(1+exp(-alpha*(SINR_dB - gamma)))
sigmoid_alpha: 0.5
sigmoid_gamma: -50.0

# Reward: R = wd*coverage + wf*freq_match - wred*dup - wp*power
#   coverage:    mean(1-Pd) across all radars — rewards jamming ALL radars
#   freq_match:  own frequency match — rewards precise jamming
#   dup:         pileup penalty — discourages redundant jamming when others uncovered
#   power:       power cost — discourages excessive power
reward_weights:
  wd: 1.0
  wf: 0.3
  wred: 0.5
  wp: 0.01
  default: 0.1