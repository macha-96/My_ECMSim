[project]
name = "ecmsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.83.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.4",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu127" }
torchvision = { index = "pytorch-cu127" }
